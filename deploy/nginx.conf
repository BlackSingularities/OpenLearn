server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # proxy_nginx łączy się po HTTP/1.0 – bez tej linii nie byłoby kompresji.
    gzip on;
    gzip_http_version 1.0;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # index.html zawsze sprawdzany – nowa wersja widoczna od razu po wdrożeniu.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Pliki z hashem w nazwie (Vite) – można trzymać długo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
