# Dołączane do bloku HTTPS redzikowski.com (proxy_nginx) przez workflow wdrożenia.
location = /openlearn {
    return 308 /openlearn/;
}

location ^~ /openlearn/ {
    resolver 127.0.0.11 valid=10s;
    set $openlearn_upstream http://openlearn:80;
    rewrite ^/openlearn/(.*)$ /$1 break;
    proxy_pass $openlearn_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /openlearn;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
}
