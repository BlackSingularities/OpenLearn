# Statyczna aplikacja webowa pod https://redzikowski.com/openlearn/ (kontener w sieci webproxy).
services:
  openlearn:
    image: nginx:1.27-alpine
    container_name: openlearn
    restart: unless-stopped
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - webproxy

networks:
  webproxy:
    name: webproxy
    external: true
